<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사용자 의견 · AI Co-Pilot</title>
<style>body{margin:0;background:#f3f6fb;color:#17243b;font:15px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:34px auto;padding:0 24px}h1{margin:0;font-size:30px}p{color:#66768c}.feedback-toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:24px 0}select,button,.feedback-link{padding:10px 15px;border:1px solid #c8d4e6;border-radius:8px;background:white;color:#243651;font:inherit}button{cursor:pointer;background:#3157d5;color:white}.feedback-items{display:grid;gap:14px}.opinion-card{padding:22px;border:1px solid #d6deeb;border-radius:14px;background:white}.opinion-meta{display:flex;gap:12px;color:#66768c;font-size:12px;flex-wrap:wrap}.opinion-message{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.opinion-status{padding:3px 10px;border-radius:14px;background:#eaf0fa;color:#36537b;font-weight:700}.opinion-status[data-status=reviewing]{background:#fff2d8;color:#956216}.opinion-status[data-status=done]{background:#def6ec;color:#087653}.opinion-resolution{border-left:3px solid #24a479;padding-left:12px;white-space:pre-wrap}.feedback-pager{display:flex;align-items:center;justify-content:space-between;margin:20px 0}.feedback-pager button:disabled{opacity:.4;cursor:default}</style></head><body><main>
<h1>사용자 의견</h1><p>접수한 의견과 진행 상태를 누구나 확인할 수 있습니다. 새 의견은 상단의 ‘의견 보내기’에서 등록하세요.</p>
<div class="feedback-toolbar"><label for="opinion-filter">처리 상태</label><select id="opinion-filter"><option value="all">전체</option><option value="new">접수</option><option value="reviewing">처리 중</option><option value="done">처리 완료</option></select><span id="opinion-total"></span><a class="feedback-link" href="/admin/feedback">관리자 처리 화면</a></div>
<div id="opinion-state" role="status" aria-live="polite">불러오는 중…</div><div id="opinion-items" class="feedback-items"></div><div class="feedback-pager"><button id="opinion-prev">이전</button><span id="opinion-page"></span><button id="opinion-next">다음</button></div>
</main><script defer src="/assets/feedback_page.js"></script></body></html>
