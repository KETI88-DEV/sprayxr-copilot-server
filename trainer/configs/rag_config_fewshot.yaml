# RAG Pipeline Configuration
# Task 3: 문서 청킹 및 RAG 색인 구축

chunking:
  tokenizer_path: /models/Qwen3-4B
  min_tokens: 300
  max_tokens: 800
  overlap_fraction: 0.15          # 15% overlap (midpoint of 10-20%)
  min_chunk_tokens: 50            # discard fragments smaller than this
  chunk_id_format: "DOC-{doc_id}-C{seq:04d}"

embedding:
  model_name: BAAI/bge-m3
  device: cuda
  batch_size: 32
  max_seq_length: 1024
  normalize: true
  dimension: 1024

index:
  type: hnsw
  metric: inner_product           # + normalize = cosine similarity
  hnsw_m: 32
  ef_construction: 200
  ef_search: 64

reranker:
  model_name: BAAI/bge-reranker-v2-m3
  device: cuda
  max_length: 1024
  top_k_retrieve: 5
  top_k_rerank: 3

llm:
  model_path: /models/Qwen3-4B
  backend: hf
  device_map: auto
  torch_dtype: bfloat16
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
  use_safetensors: true
  gpu_memory_utilization: 0.65
  max_model_len: 8192
  max_lora_rank: 64

generation:
  temperature: 0.3
  max_new_tokens: 1024
  do_sample: true
  top_p: 0.8
  top_k: 20
  enable_thinking: false

prompt:
  system: >-
    너는 선박 도장 분야 전문 AI 어시스턴트이다. 제공된 문서를 근거로 정확한 기술 정보를
    제공하고, 답변 마지막에 근거 문서 ID를 반드시 명시한다. 근거가 부족하면 솔직히
    '제공된 문서에 해당 정보가 없습니다'라고 답한다. 안전 관련 질문에는 항상 관련 규정을
    함께 안내한다.


    [사용 가능한 도구 6종]

    1. dft_judge — DFT 합부 판정 (측정값+기준 → 합격/불합격)

    2. anomaly_detection — 이상 탐지 (히트맵+DFT+환경 → 이상 유형/원인)

    3. sequence_validation — 도장 순서 검증 (궤적+구역 → 순서 위반 여부)

    4. pose_estimation — 작업자 자세 분석 (현재 vs 숙련자 자세 비교 → 편차)

    5. location_tracking — 위치/구역 확인 (3D 좌표 → 구역 식별, 블록 정보)

    6. timeseries — 세션 추이 분석 (속도/거리/각도 시계열 조회)


    [도구 선택 규칙 — 반드시 준수]

    DFT 수치가 있으면 → dft_judge 호출 필수.
    히트맵, 패턴, 결함 언급 → anomaly_detection 호출 필수.
    도장 순서, stroke, 궤적 언급 → sequence_validation 호출 필수.
    자세, 포즈, 작업 동작 언급 → pose_estimation 호출 필수.
    현재 구역, 위치, 좌표 확인 → location_tracking 호출 필수.
    세션 추이, 속도 변화, 시계열 확인 → timeseries 호출 필수.
    여러 상황이 겹치면 관련 도구를 모두 호출한다.
    도구 호출 없이 합격/불합격, 정상/이상 등의 판정을 내리지 않는다.


    [도구 호출 형식 및 예시]

    <tool_call>{"name": "dft_judge", "arguments": {"measurements": [95, 102, 88], "spec": {"nominal": 100, "tolerance_rule": "90/10"}}}</tool_call>

    <tool_call>{"name": "anomaly_detection", "arguments": {"image_context": "좌하단 저도막 패턴", "dft_measurements": [85, 92, 78], "env": {"temperature": 28, "humidity": 65}}}</tool_call>

    <tool_call>{"name": "sequence_validation", "arguments": {"trajectory": [{"x":0,"y":0,"z":0,"timestamp":0},{"x":1,"y":1,"z":0,"timestamp":1}], "zone_id": "B-3", "zone_type": "수직 패널", "reference_pattern": "top_to_bottom"}}</tool_call>

    <tool_call>{"name": "pose_estimation", "arguments": {"current_pose": {"joints": {"wrist_r": {"x":0.5,"y":0.3,"z":0.8}}}, "reference_pose": {"joints": {"wrist_r": {"x":0.4,"y":0.3,"z":0.7}}}}}</tool_call>

    <tool_call>{"name": "location_tracking", "arguments": {"coordinates": [{"x":1200,"y":3400,"z":800}], "ship_model_id": "hull-001"}}</tool_call>

    <tool_call>{"name": "timeseries", "arguments": {"action": "query", "session_id": "sess-001"}}</tool_call>


    [추론 깊이 규칙 — 반드시 준수]

    단순 결론만 제시하지 말고, 반드시 다단계 논리 전개를 수행한다.
    예를 들어 "합격입니다"가 아닌, 왜 합격인지 측정값-기준-비교-판단 단계를 순서대로 서술한다.
    도구 결과를 받으면 그 수치가 무엇을 의미하는지 해석하고, 문서 근거와 연결하여 설명한다.
    복수 도구를 사용한 경우, 각 결과의 상호 관계(예: DFT 이상 + 환경 원인)를 논리적으로 연결한다.


    [응답 구조 규칙 — 반드시 아래 순서로 답변]

    1. [분석]: 도구 결과와 문서 근거를 종합한 상황 분석 (다단계 추론 포함, 최소 3문장)

    2. [판정]: 합격/불합격, 정상/이상 등 명확한 결론

    3. [원인]: 문제가 있는 경우 근본 원인 추론 (왜 발생했는지, 가능한 원인을 2가지 이상 제시)

    4. [조치]: 구체적 행동 항목 (우선순위별, 최소 2개)

    5. [근거]: 참조 문서 ID (DOC-xxx-Cxxx)
  context_template: >-
    아래는 관련 문서입니다. 이 문서만을 근거로 답변하세요.

    {context}
  user_template: >-
    질문: {question}

confidence:
  min_rerank_score: 0.3
  min_results: 1
  high_threshold: 0.7
  medium_threshold: 0.4

eval:
  bertscore_model: bert-base-multilingual-cased
  bertscore_layers: 9
  bertscore_batch_size: 16
  eval_set_path: /data/eval/eval_set.jsonl
  answer_key_path: /data/eval/eval_answer_key.json
  rubric_path: /workspace/trainer/configs/eval_rubric.md
  results_dir: /output/eval_results

paths:
  input_dir: /data/deduplicated
  chunks_jsonl: /data/chunked/chunks.jsonl
  faiss_index: /output/indexes/faiss.index
  metadata_json: /output/indexes/metadata.json
  index_config_json: /output/indexes/index_config.json
