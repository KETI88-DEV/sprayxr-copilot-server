unit_mappings:
  - pattern: "(?i)\\b(?:u|micro)\\s*m\\b"
    replacement: "µm"
  - pattern: "㎛"
    replacement: "µm"
  - pattern: "μm"
    replacement: "µm"
  - pattern: "(?i)\\bdeg(?:ree)?\\s*c\\b"
    replacement: "°C"
  - pattern: "℃"
    replacement: "°C"
  - pattern: "(?i)\\bpercent\\b"
    replacement: "%"
  - pattern: "(?i)\\bmm\\b"
    replacement: "mm"
  - pattern: "(?i)\\bm\\s*/\\s*s\\b"
    replacement: "m/s"
  - pattern: "(?i)\\bkg\\s*/\\s*m2\\b"
    replacement: "kg/m²"
  - pattern: "(?i)\\bkg\\s*/\\s*m\\^?2\\b"
    replacement: "kg/m²"

term_replacements:
  - pattern: "건조\\s*도막\\s*두께"
    replacement: "DFT"
  - pattern: "(?i)dry\\s*film\\s*thickness"
    replacement: "DFT"
  - pattern: "\\bD\\.?F\\.?T\\b"
    replacement: "DFT"
  - pattern: "습도막\\s*두께"
    replacement: "WFT"
  - pattern: "(?i)wet\\s*film\\s*thickness"
    replacement: "WFT"
  - pattern: "\\bW\\.?F\\.?T\\b"
    replacement: "WFT"
  - pattern: "SSPC\\s*[- ]?SP\\s*0?([1-9]|10)"
    replacement: "SSPC-SP\\1"
  - pattern: "(?i)\\bISO\\s*8501-1\\b"
    replacement: "ISO 8501-1"
  - pattern: "\\bSa\\s*([123](?:\\.5)?)\\b"
    replacement: "Sa \\1"
  - pattern: "숏\\s*블라스트"
    replacement: "숏블라스트"
  - pattern: "(?i)shot\\s*blast(?:ing)?"
    replacement: "숏블라스트"
  - pattern: "블라스팅"
    replacement: "블라스팅"
  - pattern: "(?i)grinding"
    replacement: "그라인딩"
  - pattern: "도막"
    replacement: "도막"
  - pattern: "프라이머"
    replacement: "프라이머"
  - pattern: "(?i)primer"
    replacement: "프라이머"
  - pattern: "에폭시"
    replacement: "에폭시"
  - pattern: "(?i)epoxy"
    replacement: "에폭시"
  - pattern: "우레탄"
    replacement: "우레탄"
  - pattern: "(?i)urethane|polyurethane"
    replacement: "우레탄"
  - pattern: "아연"
    replacement: "아연"
  - pattern: "(?i)zinc(?:-rich)?"
    replacement: "아연"
  - pattern: "방오\\s*도료"
    replacement: "방오도료"
  - pattern: "(?i)anti[- ]?fouling\\s*paint"
    replacement: "방오도료"

header_footer_patterns:
  - "(?im)^\\s*page\\s+\\d+\\s+of\\s+\\d+\\s*$"
  - "(?im)^\\s*-\\s*\\d+\\s*-\\s*$"
  - "(?im)^\\s*[—–-]?\\s*\\d+\\s*[—–-]?\\s*$"
  - "(?im)^\\s*(?:copyright|all rights reserved).*$"
  - "(?im)^\\s*©\\s*\\d{4}.*$"
  - "(?im)^\\s*(?:confidential|internal use only).*$"
  - "(?im)^\\s*(?:문서번호|doc(?:ument)?\\s*no\\.?|revision|rev\\.?)\\s*[:#].*$"
  - "(?im)^\\s*(?:ship\\s*painting\\s*(?:specification|manual)|선박\\s*도장\\s*(?:사양서|지침서)).*$"

page_number_patterns:
  - "(?im)^\\s*page\\s*[:.]?\\s*\\d+\\s*$"
  - "(?im)^\\s*\\d+\\s*/\\s*\\d+\\s*$"
  - "(?im)^\\s*p\\.?\\s*\\d+\\s*$"
  - "(?im)^\\s*페이지\\s*\\d+\\s*$"

special_char_rules:
  - name: "remove_control_chars"
    pattern: "[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F\\x7F]"
    replacement: ""
  - name: "normalize_non_breaking_spaces"
    pattern: "[\\u00A0\\u2007\\u202F]"
    replacement: " "
  - name: "normalize_line_endings"
    pattern: "\\r\\n?|\\u2028|\\u2029"
    replacement: "\\n"
  - name: "trim_trailing_space"
    pattern: "[ \\t]+$"
    replacement: ""
    flags: "MULTILINE"
  - name: "collapse_many_blank_lines"
    pattern: "\\n{3,}"
    replacement: "\\n\\n"
