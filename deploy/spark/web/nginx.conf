# demo-ui 정적 파일 + /api same-origin 프록시 (/etc/nginx/conf.d/default.conf).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 내장 DNS. 변수 proxy_pass라서 agent-api 컨테이너가 재생성돼 IP가 바뀌어도 다시 해석한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agent_api http://agent-api:8120;

    client_max_body_size 10m;

    # /api/chat, /api/monitor/* 는 SSE, /api/v1/copilot/query 는 긴 동기 응답이다.
    location /api/ {
        proxy_pass $agent_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: 프레임을 모으지 않고 즉시 흘린다.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 5s;
        # llm.request_timeout_sec(180)·tool_deadline_sec(150)보다 길게. 도구 경로 실측 약 92초(A40).
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
