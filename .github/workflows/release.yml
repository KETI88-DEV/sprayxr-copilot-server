name: Publish release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: '검증을 마친 현재 main 커밋 (40자리 SHA)'
        required: true
        type: string
      tag:
        description: '예약한 새 버전 태그 (예: v3.9.0)'
        required: true
        type: string
      expected_release_tree:
        description: '실제 컨테이너에서 import 검사한 배포 트리 SHA (40자리)'
        required: true
        type: string
      make_latest:
        description: '이 버전을 최신 안정 릴리스로 지정'
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_RELEASE_TREE: ${{ inputs.expected_release_tree }}
      MAKE_LATEST: ${{ inputs.make_latest && 'true' || 'false' }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate the explicit release request
        run: |
          python3 - <<'PY'
          import os, re
          for key in ('SOURCE_SHA', 'EXPECTED_RELEASE_TREE'):
              if not re.fullmatch('[0-9a-f]{40}', os.environ[key]):
                  raise SystemExit(key + ' must be a full lowercase SHA')
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', os.environ['RELEASE_TAG']):
              raise SystemExit('Expected vMAJOR.MINOR.PATCH')
          PY

      - name: Check out the verified development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Check source, version, and the current release parent
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main refs/heads/release:refs/remotes/origin/release
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          git config user.name "SprayXR release automation"
          git config user.email "release-automation@users.noreply.github.com"
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            python3 - <<'PY'
          import os, pathlib, subprocess
          from trainer.scripts.version_tag_check import _release_source
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          tag = os.environ['RELEASE_TAG']
          commit = git('rev-parse', f'refs/tags/{tag}^{{commit}}')
          if (_release_source(pathlib.Path.cwd(), tag, commit, os.environ['SOURCE_SHA']) != os.environ['SOURCE_SHA']
                  or git('rev-parse', f'{commit}^{{tree}}') != os.environ['EXPECTED_RELEASE_TREE']
                  or git('rev-parse', 'refs/remotes/origin/release') != commit):
              raise SystemExit('Existing tag does not match this verified release request')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RESUME_RELEASE=true\nRELEASE_COMMIT={commit}\n')
          PY
          else
            test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_SHA"
            echo "RESUME_RELEASE=false" >> "$GITHUB_ENV"
          fi
          python3 -m trainer.scripts.version_tag_check
          python3 -m trainer.scripts.release_notes --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release.md"
          echo "PREVIOUS_RELEASE=$(git rev-parse refs/remotes/origin/release)" >> "$GITHUB_ENV"

      - name: Build only the allowlisted deployment tree
        run: |
          if [ "$RESUME_RELEASE" = true ]; then
            echo "Reusing the verified annotated tag; no commit or tag is replaced"
            exit 0
          fi
          bash deploy/release/make_release.sh "$SOURCE_SHA" "$RELEASE_TAG" origin
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          candidate="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          tree="$(git rev-parse "$candidate^{tree}")"
          test "$tree" = "$EXPECTED_RELEASE_TREE"
          test "$(git show -s --format=%P "$candidate")" = "$PREVIOUS_RELEASE"
          python3 -m trainer.scripts.version_tag_check
          echo "RELEASE_COMMIT=$candidate" >> "$GITHUB_ENV"

      - name: Publish the deployment branch and annotated tag atomically
        run: |
          if [ "$RESUME_RELEASE" = true ]; then
            test "$(git ls-remote origin refs/heads/release | cut -f1)" = "$RELEASE_COMMIT"
            exit 0
          fi
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          git push --atomic origin "$RELEASE_COMMIT:refs/heads/release" "refs/tags/$RELEASE_TAG"

      - name: Publish notes from the original main source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG · SprayXR AI Co-Pilot" \
              --notes-file "$RUNNER_TEMP/release.md" --draft=false --prerelease=false --latest="$MAKE_LATEST"
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "$RELEASE_TAG · SprayXR AI Co-Pilot" \
              --notes-file "$RUNNER_TEMP/release.md" --latest="$MAKE_LATEST"
          fi

      - name: Verify publication and preserve source provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/published-release.json"
          gh api "repos/$GH_REPO/releases/latest" > "$RUNNER_TEMP/latest-release.json"
          gh api "repos/$GH_REPO/git/ref/heads/release" > "$RUNNER_TEMP/release-ref.json"
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag-ref.json"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          release = json.loads((temp / 'published-release.json').read_text())
          latest = json.loads((temp / 'latest-release.json').read_text())
          branch = json.loads((temp / 'release-ref.json').read_text())
          tag_ref = json.loads((temp / 'tag-ref.json').read_text())
          if tag_ref['object']['type'] != 'tag':
              raise SystemExit('The version must be an annotated tag')
          tag = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GH_REPO']}/git/tags/{tag_ref['object']['sha']}"], text=True))
          commit = os.environ['RELEASE_COMMIT']
          if branch['object']['sha'] != commit or tag['object']['sha'] != commit:
              raise SystemExit('Release branch/tag does not point to the verified deployment commit')
          if release['tag_name'] != os.environ['RELEASE_TAG'] or release['draft'] or release['prerelease'] or not release['published_at']:
              raise SystemExit('Expected a published stable release')
          if os.environ['MAKE_LATEST'] == 'true' and latest['id'] != release['id']:
              raise SystemExit('Release is not marked latest')
          receipt = {key: release[key] for key in ('id', 'tag_name', 'html_url', 'published_at')}
          receipt.update(source_main_commit=os.environ['SOURCE_SHA'], release_commit=commit,
                         release_tree=os.environ['EXPECTED_RELEASE_TREE'], is_latest=latest['id'] == release['id'],
                         import_verification='operator-prechecked tree; exact hash matched before publication',
                         run_url=f"https://github.com/{os.environ['GH_REPO']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          (temp / 'release-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published [{receipt['tag_name']}]({receipt['html_url']}); source={receipt['source_main_commit']}; release={commit}\n")
          PY
          note_ref="refs/notes/releases/$RELEASE_TAG"
          if git ls-remote --exit-code origin "$note_ref" >/dev/null 2>&1; then
            git fetch origin "$note_ref:$note_ref"
            git notes --ref="$note_ref" show "$RELEASE_COMMIT" > "$RUNNER_TEMP/existing-receipt.json"
            python3 - <<'PY'
          import json, os, pathlib
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          old = json.loads((temp / 'existing-receipt.json').read_text())
          new = json.loads((temp / 'release-receipt.json').read_text())
          for key in ('id', 'tag_name', 'source_main_commit', 'release_commit', 'release_tree'):
              if old.get(key) != new[key]:
                  raise SystemExit('Existing release receipt has different provenance: ' + key)
          PY
            echo "Verified the existing receipt; no note is overwritten"
            exit 0
          fi
          git notes --ref="$note_ref" add -F "$RUNNER_TEMP/release-receipt.json" "$RELEASE_COMMIT"
          git push origin "$note_ref:$note_ref"
